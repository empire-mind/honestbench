name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: harness smoke (offline, stdlib only)
        run: cd evals && python run.py --adapter grep-only --queries all
      - name: compile check
        run: python -m py_compile evals/run.py evals/adapters/base.py evals/adapters/grep_only.py code-factory/factory.py
      - name: execution-plane backend probes (exit 0, reports live)
        run: cd code-factory && ./factory backends
